{% extends 'base.html' %}
{% block title %}<title>Вход в аккаунт</title>{% endblock %}
{% block meta_description %}<meta name="description" content="Вход в аккаунт системы безопасной жизни. Введите свои учетные данные для доступа к личному кабинету и функциям.">{% endblock %}
{% block society %}
    <meta property="og:title" content="Вход в аккаунт">
    <meta property="og:description" content="Вход в аккаунт системы безопасной жизни. Введите свои учетные данные для доступа к личному кабинету и функциям.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://safe-life-system.ru/user_login/">
    <meta property="og:site_name" content="Safe Life System">
{% endblock %}
{% block content %}
    <div class="login-block login-block__position">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input class="login-block_input" type="text" placeholder="Имя" name='username'>
            <input class="login-block_input" placeholder="Пароль" name='password' type="password">
            <button class="login-block__user-save" type="submit" value="Login">Войти</button>
        </form>
    </div>
{% endblock %}
